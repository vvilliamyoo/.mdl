name: Build Winget Catalog

on:
  schedule:
    - cron: "0 6 * * 0" # Every Sunday at 06:00 UTC (midnight CST)
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Git authentication
        run: |
          git config --global url.https://x-access-token:${{ secrets.MDL_WINGET_CATALOG_UPDATE_GH_PAT }}@github.com/.insteadOf https://github.com/

      - name: Build frontend and catalog and deploy
        run: npm run deploy # Note: "predeploy": "npm run build:catalog && npm run build"
        env:
          GH_TOKEN: ${{ secrets.MDL_WINGET_CATALOG_UPDATE_GH_PAT }}
