name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "jsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "src/**"
      - "svelte.config.js"
      - "tools/build-catalog.mjs"
      - "vite.config.js"
  schedule:
    - cron: "0 6 * * 0" # Every Sunday at 06:00 UTC (midnight CST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Restore catalog cache
        uses: actions/cache@v4
        with:
          path: .cache/winget-pkgs-src
          key: winget-catalog-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            winget-catalog-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build catalog and site
        run: npm run build:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
